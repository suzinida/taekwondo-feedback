<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태권도 품새 경기 준비하기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="setupScreen" class="screen active setup-screen">
    <div class="header">
      <h1>태권도 품새 경기 준비하기</h1>
      <p>시범 영상과 함께 자세를 비교하고 피드백하세요</p>
    </div>

    <div class="video-container-setup">
      <div class="video-box-setup">
        <div class="video-label">시범 영상</div>
        <video id="demoVideo" controls></video>
      </div>
      <div class="video-box-setup">
        <div class="video-label">학생 영상</div>
        <video id="studentVideoSetup" controls></video>
        <div class="empty-state" id="studentEmpty" style="position: absolute;">영상 업로드</div>
      </div>
    </div>

    <div class="controls-setup">
      <div class="control-group">
        <label class="control-label">1단계: 영상 업로드</label>
        <div class="button-group">
          <input type="file" id="studentFile" accept="video/mp4" style="display: none;">
          <button onclick="document.getElementById('studentFile').click()">학생 영상 선택</button>
        </div>
      </div>

      <div class="control-group">
        <label class="control-label">2단계: 싱크 맞추기</label>
        <input type="range" id="offsetSlider" min="-5" max="5" value="0" step="0.1">
        <div class="slider-info">
          <span>뒤처짐</span>
          <span id="offsetDisplay">0초</span>
          <span>앞서감</span>
        </div>
      </div>

      <div class="control-group">
        <label class="control-label">속도 선택</label>
        <div class="speed-options">
          <button class="speed-btn" onclick="setSpeedSetup(0.5)">0.5배</button>
          <button class="speed-btn active" onclick="setSpeedSetup(1)">1배</button>
          <button class="speed-btn" onclick="setSpeedSetup(1.25)">1.25배</button>
          <button class="speed-btn" onclick="setSpeedSetup(1.5)">1.5배</button>
        </div>
      </div>

      <div class="control-group play-section">
        <label class="control-label">3단계: 재생 (싱크 확인)</label>
        <div class="button-group">
          <button onclick="playSetup()" id="playBtnSetup">재생</button>
          <button onclick="pauseSetup()">일시정지</button>
          <button onclick="resetSetup()">처음으로</button>
        </div>
      </div>

      <div class="control-group">
        <button class="primary" onclick="switchToFeedback()">피드백하기</button>
      </div>
    </div>
  </div>

  <div id="feedbackScreen" class="screen feedback-screen">
    <div class="video-container-feedback">
      <div class="video-box-feedback">
        <div class="video-label">시범</div>
        <video id="demoVideoFeedback"></video>
      </div>
      <div class="video-box-feedback">
        <div class="video-label">학생</div>
        <video id="studentVideoFeedback"></video>
      </div>
    </div>

    <div class="controls-feedback">
      <button onclick="switchToSetup()">돌아가기</button>
      <button class="primary" onclick="playBoth()" id="playBtnFeedback">재생</button>
      <button onclick="pauseBoth()" id="pauseBtnFeedback">중지</button>
      <button onclick="resetFeedback()">초기화</button>
      <div class="speed-small">
        <button class="speed-btn" onclick="setSpeedFeedback(0.5)">0.5배</button>
        <button class="speed-btn active" onclick="setSpeedFeedback(1)">1배</button>
        <button class="speed-btn" onclick="setSpeedFeedback(1.25)">1.25배</button>
        <button class="speed-btn" onclick="setSpeedFeedback(1.5)">1.5배</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
